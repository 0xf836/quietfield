name: Build site

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build, check and package site
        run: npm run package
      - name: Smoke-test deployment archive
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS
          mkdir "$RUNNER_TEMP/site-smoke"
          tar -xzf digital-field-station.tar.gz -C "$RUNNER_TEMP/site-smoke"
          cd ..
          node scripts/check.mjs "$RUNNER_TEMP/site-smoke"
      - name: Save deployment artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digital-field-station-${{ github.sha }}
          path: |
            artifacts/digital-field-station.tar.gz
            artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 90

  release:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified deployment artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digital-field-station-${{ github.sha }}
          path: artifacts
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --pattern digital-field-station.tar.gz --pattern SHA256SUMS --dir existing
            cmp digital-field-station.tar.gz existing/digital-field-station.tar.gz
            cmp SHA256SUMS existing/SHA256SUMS
            echo "Release already contains this verified build."
          else
            gh release create "$RELEASE_TAG" digital-field-station.tar.gz SHA256SUMS \
              --verify-tag --title "Digital Field Station $RELEASE_TAG" \
              --notes "Static site archive and SHA-256 checksum. Extract the archive into the web document root."
          fi
